plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'com.android.library' version '9.4.1' apply false
    id 'com.google.gms.google-services' version '4.4.3' apply false
    // Baseline Profile producer plugin (the appbenchmark test module).
    // 1.5.0 is the current stable line and pairs with
    // androidx.benchmark:benchmark-macro-junit4:1.5.0.
    id 'androidx.baselineprofile' version '1.5.0' apply false
    // KSP >= 2.3 is version-decoupled from the Kotlin compiler (AGP 9 ready)
    id 'com.google.devtools.ksp' version '2.3.14' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21' apply false
}

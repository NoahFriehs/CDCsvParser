plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Optional API keys for LOCAL TESTING ONLY: lines in the gitignored root
// local.properties land in the DEBUG build and never in release:
//   coingecko_api_key=    faster CG rate limits while developing
//   cryptocompare_api_key= deep-history fallback (budget: 100 calls/month!
//      the CC deep source only spends it on first-time deep backfills)
def localProps = new Properties()
def cgKeyFile = new File(rootDir, 'local.properties')
if (cgKeyFile.exists()) {
    cgKeyFile.withInputStream { localProps.load(it) }
}
def cgApiKey = (localProps.getProperty('coingecko_api_key', '') ?: '').trim()
def ccApiKey = (localProps.getProperty('cryptocompare_api_key', '') ?: '').trim()


android {
    namespace 'at.msd.friehs_bicha.cdcsvparser'
    compileSdk 37
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "at.msd.friehs_bicha.cdcsvparser"
        minSdk 26
        targetSdk 35 // edge-to-edge handled per activity via util.EdgeToEdge
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        externalNativeBuild {
            cmake {
                cppFlags "-DANDROID"
            }
        }
    }

    buildTypes {
        release {
            // Always keyless (the debug key must never ship).
            buildConfigField "String", "CG_API_KEY", "\"\""
            buildConfigField "String", "CC_API_KEY", "\"\""
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            buildConfigField "String", "CG_API_KEY", "\"$cgApiKey\""
            buildConfigField "String", "CC_API_KEY", "\"$ccApiKey\""
            jniDebuggable true
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility "17"
        targetCompatibility "17"
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    testOptions {
        // Android framework calls (Log, etc.) in unit tests return default
        // values instead of throwing "not mocked"
        unitTests.setReturnDefaultValues(true)
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.10.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.2'

    implementation platform('com.google.firebase:firebase-bom:33.10.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-firestore'

    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    def room_version = "2.7.1"

    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    implementation "androidx.datastore:datastore-preferences:1.2.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    // Compose (Phase 3.1): BOM + UI + M3. The compiler comes from the
    // kotlin.plugin.compose plugin above (Kotlin 2.x style).
    implementation(platform("androidx.compose:compose-bom:2026.09.00"))
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.material:material-icons-core")
    implementation("androidx.compose.ui:ui-tooling-preview")
    debugImplementation("androidx.compose.ui:ui-tooling")

    implementation("androidx.work:work-runtime-ktx:2.12.0")
    implementation("com.squareup.retrofit2:retrofit:3.0.0")
    implementation("com.squareup.retrofit2:converter-kotlinx-serialization:3.0.0")
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0")

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    // 3.5: instrumented UI tests. Pure UiAutomator on top of
    // ActivityScenarioRule - deliberately NO espresso/compose-test deps: on
    // the API 37 dev-preview image Espresso's InputManagerEventInjectionStrategy
    // crashes (android.hardware.input.InputManager.getInstance was removed),
    // which wedges the Compose test rule's idle hook and every Espresso.onIdle.
    androidTestImplementation 'androidx.test:core:1.7.0'
    // Runner is declared only in the test manifest - make it a real dep
    // (it used to arrive transitively via espresso).
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}